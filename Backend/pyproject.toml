[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Minimal backend scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "celery[redis]>=5.4.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "xgboost>=2.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
